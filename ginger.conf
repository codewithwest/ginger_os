# GingerOS Configuration File
# ---------------------------

# LFS Settings
LFS_VERSION=13.0
LFS_MOUNT=/mnt/ginger_lfs
BUILD_TYPE=image

# Image Settings
IMAGE_NAME=ginger_os.img
IMAGE_SIZE=32G

# Architecture
LFS_TGT=x86_64-lfs-linux-gnu

# Experimental: parallel Phase 3 package builds (set true to enable)
# Splits unbuilt packages into windows of PARALLEL_WINDOW and builds them concurrently.
# WARNING: may expose latent dependency issues. Default: false
PARALLEL_PHASE3=false
PARALLEL_WINDOW=4

# Core Toolchain Versions
BINUTILS_VERSION=2.46.0
GCC_VERSION=15.2.0
GLIBC_VERSION=2.43
LINUX_VERSION=6.18.10
MPFR_VERSION=4.2.2
GMP_VERSION=6.3.0
MPC_VERSION=1.3.1
