name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './lfs'
          severity: error  # Fail on errors; warnings are tracked separately during baseline hardening

  installer:
    name: Go installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: lfs/iso/installer/go.sum
      - name: Test and build installer
        working-directory: lfs/iso/installer
        run: |
          go test ./...
          CGO_ENABLED=0 go build -trimpath -o /tmp/ginger-installer .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic fastapi uvicorn psutil rich
      - name: Run Python Engine Tests
        run: mkdir -p logs && export PYTHONPATH=$PYTHONPATH:. && python3 tests/test_engine.py
      - name: Run Bash Library Tests
        run: bash tests/test_lib_common.sh
      - name: Run Rootfs Validation Tests
        run: python3 tests/test_rootfs_validation.py
      - name: Run Network Config Tests
        run: python3 tests/test_network_config.py
      - name: Run Telemetry Tests
        run: python3 tests/test_telemetry.py
      - name: Run Core API Tests
        run: python3 tests/test_core_api.py
      - name: Smoke-test telemetry JSON CLI
        run: python3 lfs/phase3-system/ginger-telemetry.py | python3 -m json.tool > /dev/null
